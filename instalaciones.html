.worker-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #EEEAE1;}

.avatar{width:32px; height:32px; border-radius:8px; background:var(--acero-claro); color:var(--acero); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'Oswald',sans-serif; flex-shrink:0;}

.problema-card{border-left:3px solid var(--rojo); padding:10px 12px; background:var(--rojo-claro); border-radius:0 8px 8px 0; margin-bottom:8px;}
.problema-card.resuelto{border-left-color:var(--verde); background:var(--verde-claro);}

.problema-card.resuelto .problema-top{color:var(--verde);}
.problema-txt{font-size:12.5px; color:var(--ink); margin-top:4px; line-height:1.4;}

.bitacora-entry{border-left:3px solid var(--acero); padding:8px 12px; background:var(--acero-claro); border-radius:0 8px 8px 0; margin-bottom:8px;}

.ai-tag{font-size:10.5px; color:var(--acero); margin-top:5px; display:flex; align-items:center; gap:5px;}
.envio-card{border:1px solid var(--borde); border-radius:9px; padding:11px; margin-bottom:9px;}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:flex-end;}

.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--concreto); padding:10px 18px; border-radius:20px; font-size:13px; z-index:200; box-shadow:0 6px 16px rgba(0,0,0,0.25);}

<body>
<div id="app"></div>
<script>
window.App = window.App || {};

/* ===================== STORAGE (IndexedDB) ===================== */
App.Storage = (function(){
  const DB_NAME = 'instalaciones_db';
  const DB_VERSION = 2;
  let dbPromise = null;

  function open(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('instalaciones')){
          db.createObjectStore('instalaciones', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('trabajadores')){
          db.createObjectStore('trabajadores', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('herramientasCatalogo')){
          db.createObjectStore('herramientasCatalogo', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('actividadesCatalogo')){
          db.createObjectStore('actividadesCatalogo', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('gruposTrabajo')){
          db.createObjectStore('gruposTrabajo', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('config')){
          db.createObjectStore('config', {keyPath:'key'});
        }
      };
      req.onsuccess = (e)=> resolve(e.target.result);
      req.onerror = (e)=> reject(e.target.error);
    });
    return dbPromise;
  }

  function tx(storeName, mode){
    return open().then(db=> db.transaction(storeName, mode).objectStore(storeName));
  }

  function getAll(storeName){
    return tx(storeName,'readonly').then(store=> new Promise((res,rej)=>{
      const r = store.getAll();
      r.onsuccess = ()=> res(r.result || []);
      r.onerror = ()=> rej(r.error);
    }));
  }
  function get(storeName, id){
    return tx(storeName,'readonly').then(store=> new Promise((res,rej)=>{
      const r = store.get(id);
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> rej(r.error);
    }));
  }
  function put(storeName, obj){
    return tx(storeName,'readwrite').then(store=> new Promise((res,rej)=>{
      const r = store.put(obj);
      r.onsuccess = ()=> res(obj);
      r.onerror = ()=> rej(r.error);
    }));
  }
  function del(storeName, id){
    return tx(storeName,'readwrite').then(store=> new Promise((res,rej)=>{
      const r = store.delete(id);
      r.onsuccess = ()=> res(true);
      r.onerror = ()=> rej(r.error);
    }));
  }

  return {getAll, get, put, delete: del};
})();

function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hoy(){ return new Date().toISOString().slice(0,10); }
function horaAhora(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function fmtFecha(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }

/* ===================== REPOSITORY ===================== */
App.Repo = (function(){
  const S = App.Storage;

  function nuevaInstalacion(data){
    const inst = {
      id: uid('inst'),
      nombre: data.nombre || 'Instalación sin nombre',
      cliente: data.cliente || '',
      ubicacion: data.ubicacion || '',
      fechaInicio: data.fechaInicio || hoy(),
      cotizacionRef: '',
      estado: 'pendiente', // pendiente | curso | final
      herramientasPropias: [], // {id,nombre,llevar:bool}
      herramientasSolicitar: [], // {id,nombre,estado:'pendiente'|'enviado'}
      herramientasComprar: [], // {id,nombre,costo}
      materiales: [], // {id,nombre,cantidad,estado:'pendiente'|'entregado'}
      transporte: [], // {id,modo,empresa,solicitado,carga,llegadaEst,llegadaReal,costo,estado}
      personalFijoIds: [], // ids de App.Repo trabajadores catálogo
      personalExtra: [], // {id,nombre,ciudad}
      registroHoras: [], // {id, trabajadorId, esExtra:bool, fecha, entrada, salida}
      cronograma: [], // {id,nombre,horasEstimadas,origen:'manual'|'ia_historial'|'ia_general',horasReales,asignado}
      produccion: { unidadNombre:'', unidadTotal:0, metaSemanal:0, zonas: [] }, // zonas: {id,nombre,cantidadRequerida}
      avanceRegistros: [], // {id,fecha,zonaId,cantidad,asignado:{tipo,id,nombre},nota}
      documentos: [], // {id,nombre,tipo,dataUrl,fecha}
      checklistGeneral: [], // {id,texto,hecho,fechaCompletado}
      bitacoraDiaria: [], // {id,fecha,texto,desvio:bool}
      problemas: [], // {id,fecha,prioridad,texto,estado:'abierto'|'resuelto'}
      acta: {observaciones:'', firmaCliente:null, firmaResponsable:null, fechaEntrega:''},
      creado: new Date().toISOString()
    };
    return S.put('instalaciones', inst);
  }

  function guardar(inst){ return S.put('instalaciones', inst); }
  function obtener(id){ return S.get('instalaciones', id); }
  function listar(){ return S.getAll('instalaciones'); }
  function eliminar(id){ return S.delete('instalaciones', id); }

  // Catálogos reutilizables
  function catalogoTrabajadores(){ return S.getAll('trabajadores'); }
  function agregarTrabajador(nombre, rol){
    const t = {id: uid('trab'), nombre, rol: rol||'', activo:true};
    return S.put('trabajadores', t);
  }
  function catalogoHerramientas(){ return S.getAll('herramientasCatalogo'); }
  function agregarHerramientaCatalogo(nombre){
    const h = {id: uid('herr'), nombre};
    return S.put('herramientasCatalogo', h);
  }
  function catalogoActividades(){ return S.getAll('actividadesCatalogo'); }
  function agregarActividadCatalogo(nombre){
    const a = {id: uid('act'), nombre};
    return S.put('actividadesCatalogo', a);
  }
  function catalogoGrupos(){ return S.getAll('gruposTrabajo'); }
  function agregarGrupo(nombre, miembros){
    const g = {id: uid('grp'), nombre, miembros: miembros||[]};
    return S.put('gruposTrabajo', g);
  }
  function guardarGrupo(g){ return S.put('gruposTrabajo', g); }
  function eliminarGrupo(id){ return S.delete('gruposTrabajo', id); }

  // Tareas (actividades de cronograma) asignadas a un trabajador o grupo, a través de todas las instalaciones
  async function tareasDe(tipo, id){
    const todas = await listar();
    const resultado = [];
    todas.forEach(inst=>{
      (inst.cronograma||[]).forEach(a=>{
        if(a.asignado && a.asignado.tipo===tipo && a.asignado.id===id){
          resultado.push({instalacionId: inst.id, instalacionNombre: inst.nombre, actividad: a});
        }
      });
    });
    return resultado;
  }

  function config(key){ return S.get('config', key); }
  function setConfig(key, value){ return S.put('config', {key, value}); }

  // KPIs
  function calcularAvance(inst){
    if(!inst.cronograma.length) return 0;
    const conReal = inst.cronograma.filter(a=>a.completada).length;
    return Math.round((conReal/inst.cronograma.length)*100);
  }
  function totalHoras(inst, trabajadorKey){
    let mins = 0;
    inst.registroHoras.forEach(r=>{
      const key = r.esExtra? r.trabajadorId : r.trabajadorId;
      if(trabajadorKey && key!==trabajadorKey) return;
      if(r.entrada && r.salida){
        const [eh,em]=r.entrada.split(':').map(Number);
        const [sh,sm]=r.salida.split(':').map(Number);
        mins += (sh*60+sm)-(eh*60+em);
      }
    });
    return mins;
  }
  function fmtMinutos(mins){
    if(mins<=0) return '0h 0m';
    const h = Math.floor(mins/60), m = mins%60;
    return h+'h '+m+'m';
  }

  // Producción por unidades (ej. puertas, zonas/pisos, avance semanal)
  function numSemanaISO(fechaStr){
    const d = new Date(fechaStr+'T00:00:00');
    const target = new Date(d.valueOf());
    const dayNr = (d.getDay()+6)%7;
    target.setDate(target.getDate()-dayNr+3);
    const firstThursday = new Date(target.getFullYear(),0,4);
    const diff = target - firstThursday;
    const semana = 1 + Math.round(diff/(7*24*3600*1000));
    return target.getFullYear()+'-S'+semana;
  }
  function calcularProduccion(inst){
    const regs = inst.avanceRegistros||[];
    const totalInstalado = regs.reduce((a,r)=>a+(r.cantidad||0),0);
    const porZona = {};
    regs.forEach(r=>{ porZona[r.zonaId] = (porZona[r.zonaId]||0)+r.cantidad; });
    const semanaActual = numSemanaISO(hoy());
    const instaladoSemana = regs.filter(r=> numSemanaISO(r.fecha)===semanaActual).reduce((a,r)=>a+r.cantidad,0);
    const unidadTotal = (inst.produccion&&inst.produccion.unidadTotal)||0;
    const pct = unidadTotal>0 ? Math.round(totalInstalado/unidadTotal*100) : 0;
    return {totalInstalado, porZona, instaladoSemana, pct, unidadTotal};
  }

  return {
    nuevaInstalacion, guardar, obtener, listar, eliminar,
    catalogoTrabajadores, agregarTrabajador,
    catalogoHerramientas, agregarHerramientaCatalogo,
    catalogoActividades, agregarActividadCatalogo,
    catalogoGrupos, agregarGrupo, guardarGrupo, eliminarGrupo, tareasDe,
    config, setConfig,
    calcularAvance, totalHoras, fmtMinutos,
    calcularProduccion, numSemanaISO
  };
})();

/* ===================== IA - Sugerencia de tiempos ===================== */
App.IA = (function(){

  async function historialActividad(nombreActividad){
    const todas = await App.Repo.listar();
    const registros = [];
    todas.forEach(inst=>{
      (inst.cronograma||[]).forEach(a=>{
        if(a.nombre.trim().toLowerCase() === nombreActividad.trim().toLowerCase() && a.horasReales){
          registros.push(a.horasReales);
        }
      });
    });
    return registros;
  }

  async function sugerirTiempo(nombreActividad){
    const historial = await historialActividad(nombreActividad);
    if(historial.length){
      const prom = historial.reduce((a,b)=>a+b,0)/historial.length;
      return {
        horas: Math.round(prom*10)/10,
        origen: 'ia_historial',
        nota: 'Basado en '+historial.length+' instalación(es) similares tuyas'
      };
    }
    // sin historial propio: pedir estimado general a la API
    const apiKeyCfg = await App.Repo.config('anthropicApiKey');
    const apiKey = apiKeyCfg ? apiKeyCfg.value : null;
    if(!apiKey){
      return {horas: 2, origen:'ia_general', nota:'Estimado por defecto (configura tu API key en Ajustes para estimaciones más precisas)'};
    }
    try{
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key': apiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:100,
          messages:[{role:'user', content:'Eres un experto en instalación de muebles y closets a la medida. Da SOLO un número (puede tener un decimal) que represente las horas estimadas típicas para completar esta actividad de instalación: "'+nombreActividad+'". Responde solo el número, nada más.'}]
        })
      });
      const data = await resp.json();
      const texto = (data.content && data.content[0] && data.content[0].text) || '2';
      const horas = parseFloat(texto.match(/[\d.]+/)?.[0] || '2');
      return {horas: horas || 2, origen:'ia_general', nota:'Estimado general de IA (sin historial propio todavía)'};
    }catch(err){
      return {horas: 2, origen:'ia_general', nota:'No se pudo consultar IA — estimado por defecto'};
    }
  }

  return {sugerirTiempo};
})();

App.Charts = (function(){
  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function barrasCronograma(actividades){
    if(!actividades.length) return '';
    const max = Math.max(...actividades.map(a=> Math.max(a.horasEstimadas||0, a.horasReales||0)), 1);
    const filas = actividades.map(a=>{
      const wEst = Math.round((a.horasEstimadas||0)/max*100);
      const wReal = a.horasReales!=null ? Math.round((a.horasReales/max)*100) : 0;
      return '<div style="margin-bottom:10px;">'+
        '<div style="font-size:11.5px; font-weight:600; margin-bottom:3px;">'+esc(a.nombre)+'</div>'+
        '<div style="background:var(--concreto-osc); border-radius:5px; height:10px; overflow:hidden; margin-bottom:2px;">'+
          '<div style="background:var(--acero); height:100%; width:'+wEst+'%; border-radius:5px;"></div>'+
        '</div>'+
        (a.horasReales!=null ? '<div style="background:var(--concreto-osc); border-radius:5px; height:10px; overflow:hidden;">'+
          '<div style="background:'+(a.horasReales>a.horasEstimadas?'var(--rojo)':'var(--verde)')+'; height:100%; width:'+wReal+'%; border-radius:5px;"></div>'+
        '</div>' : '')+
        '<div style="font-family:\'IBM Plex Mono\',monospace; font-size:10px; color:var(--ink-suave); margin-top:2px;">'+
          'Est: '+a.horasEstimadas+'h'+(a.horasReales!=null? ' · Real: '+a.horasReales+'h':'')+
        '</div>'+
      '</div>';
    }).join('');
    return '<div style="margin-bottom:14px;">'+filas+
      '<div style="font-size:10px; color:var(--ink-suave); display:flex; gap:12px;">'+
        '<span>▬ <span style="color:var(--acero);">Estimado</span></span>'+
        '<span>▬ <span style="color:var(--verde);">Real (a tiempo)</span></span>'+
        '<span>▬ <span style="color:var(--rojo);">Real (excedido)</span></span>'+
      '</div></div>';
  }

  function barrasHoras(datos){
    if(!datos.length) return '<div class="empty" style="padding:14px 0;">Sin horas registradas</div>';
    const max = Math.max(...datos.map(d=>d.minutos), 1);
    return datos.map(d=>{
      const w = Math.max(Math.round(d.minutos/max*100), 2);
      const horas = Math.floor(d.minutos/60), mins = d.minutos%60;
      return '<div style="margin-bottom:9px;">'+
        '<div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; margin-bottom:3px;">'+
          '<span>'+esc(d.nombre)+'</span><span style="font-family:\'IBM Plex Mono\',monospace; color:var(--ink-suave);">'+horas+'h '+mins+'m</span>'+
        '</div>'+
        '<div style="background:var(--concreto-osc); border-radius:5px; height:12px; overflow:hidden;">'+
          '<div style="background:var(--naranja); height:100%; width:'+w+'%; border-radius:5px;"></div>'+
        '</div></div>';
    }).join('');
  }

  return {barrasCronograma, barrasHoras};
})();

App.UIHelpers = (function(){
  function toast(msg){
    const el = document.createElement('div');
    el.className='toast'; el.textContent=msg;
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 2200);
  }
  function openModal(title, bodyHtml, onMount){
    closeModal();
    const overlay = document.createElement('div');
    overlay.className='modal-overlay'; overlay.id='modalOverlay';
    overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
    overlay.innerHTML = '<div class="modal-sheet"><div class="modal-title">'+title+'</div>'+bodyHtml+'</div>';
    document.body.appendChild(overlay);
    if(onMount) onMount(overlay);
  }
  function closeModal(){
    const el = document.getElementById('modalOverlay');
    if(el) el.remove();
  }
  function esc(s){
    return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  return {toast, openModal, closeModal, esc};
})();

App.Views.horasGlobales = async function(){
  const {esc} = App.UIHelpers;
  const todas = await App.Repo.listar();
  const cat = await App.Repo.catalogoTrabajadores();
  const yo = await App.Repo.config('miNombre');
  const miNombre = yo ? yo.value : 'Isaac Zamora';

  const acumulado = {}; // key: 'trabajador|id' o 'extra|id' o 'YO' -> {nombre, minutos}
  todas.forEach(inst=>{
    (inst.registroHoras||[]).forEach(r=>{
      if(!r.entrada || !r.salida) return;
      const [eh,em]=r.entrada.split(':').map(Number);
      const [sh,sm]=r.salida.split(':').map(Number);
      const min = (sh*60+sm)-(eh*60+em);
      if(min<=0) return;
      let key, nombre;
      if(r.trabajadorId==='YO'){ key='YO'; nombre=miNombre+' (tú)'; }
      else if(r.esExtra){
        const p = (inst.personalExtra||[]).find(x=>x.id===r.trabajadorId);
        key = 'extra|'+r.trabajadorId; nombre = p?p.nombre:'—';
      } else {
        const t = cat.find(x=>x.id===r.trabajadorId);
        key = 'fijo|'+r.trabajadorId; nombre = t?t.nombre:'—';
      }
      if(!acumulado[key]) acumulado[key] = {nombre, minutos:0};
      acumulado[key].minutos += min;
    });
  });
  const datos = Object.values(acumulado).sort((a,b)=>b.minutos-a.minutos);

  const html =
    '<div class="topbar" style="padding-bottom:20px;">'+
      '<button class="back" onclick="App.Router.abrirPersonalGlobal()">‹ PERSONAL</button>'+
      '<div class="det-title">Horas totales</div>'+
      '<div class="det-cliente">Acumulado en todas tus instalaciones</div>'+
    '</div>'+
    '<div class="content">'+
      '<div class="card"><h3>Por persona</h3>'+App.Charts.barrasHoras(datos)+'</div>'+
    '</div>';
  document.getElementById('app').innerHTML = html;
};

/* ===================== SIGNATURE PAD ===================== */
App.SignaturePad = (function(){
  const pads = {};

  function montar(canvasId, dataUrlPrevia){
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    const ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.strokeStyle = '#1F2421';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    let dibujando = false, last = null;

    pads[canvasId] = {canvas, ctx, vacio:true};

    if(dataUrlPrevia){
      const img = new Image();
      img.onload = ()=> ctx.drawImage(img,0,0,rect.width,rect.height);
      img.src = dataUrlPrevia;
      pads[canvasId].vacio = false;
    }

    function pos(e){
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {x: t.clientX - r.left, y: t.clientY - r.top};
    }
    function start(e){ e.preventDefault(); dibujando=true; last=pos(e); }
    function move(e){
      if(!dibujando) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last = p; pads[canvasId].vacio=false;
    }
    function end(){ dibujando=false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
  }

  function limpiar(canvasId){
    const p = pads[canvasId];
    if(!p) return;
    p.ctx.clearRect(0,0,p.canvas.width,p.canvas.height);
    p.vacio = true;
  }

  function obtenerDataUrl(canvasId){
    const p = pads[canvasId];
    if(!p || p.vacio) return null;
    return p.canvas.toDataURL('image/png');
  }

  return {montar, limpiar, obtenerDataUrl};
})();

  function subirDocumento(instId){

    const tipo = document.getElementById('docTipo').value;
    const file = fileInput.files[0];
    if(!file){ toast('Selecciona un archivo primero'); return; }
    const reader = new FileReader();
    reader.onload = async function(e){
      const i = await inst(instId);
      i.documentos.push({id: uid('doc'), nombre:file.name, tipo, dataUrl:e.target.result, fecha:hoy()});

  async function _confirmarAvance(instId){
    const zonaId = document.getElementById('avZona').value;
    const cantidad = parseInt(document.getElementById('avCantidad').value) || 0;
    const fecha = document.getElementById('avFecha').value || hoy();
    const nota = document.getElementById('avNota').value.trim();
    const asignado = _leerAsignadoGenerico('avAsignado');
    if(!zonaId || !cantidad){ toast('Falta zona o cantidad'); return; }
    const i = await inst(instId);
    if(!i.avanceRegistros) i.avanceRegistros = [];
    i.avanceRegistros.push({id: uid('av'), fecha, zonaId, cantidad, asignado, nota});
    closeModal();
    await guardarYRefrescar(i);
  }
  function _leerAsignadoGenerico(selectId){
    const val = document.getElementById(selectId).value;
    if(!val) return null;
    const [tipo, id, nombre] = val.split('|');
    return {tipo, id, nombre};
  }

  // ---- Bitácora diaria ----
  function agregarBitacora(instId){
    openModal('Entrada de bitácora — '+fmtFecha(hoy()),
      '<label>¿Qué pasó hoy?</label><textarea id="bTexto" placeholder="Describe el avance del día, decisiones tomadas, cambios..."></textarea>'+
      '<label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="bDesvio" style="width:auto; margin:0;"> Este día representó un desvío del cronograma planeado</label>'+
      '<button class="btn-primary" onclick="App.Handlers._confirmarBitacora(\''+instId+'\')">Guardar entrada</button>'
    );
  }
  async function _confirmarBitacora(instId){
    const texto = document.getElementById('bTexto').value.trim();
    const desvio = document.getElementById('bDesvio').checked;
    if(!texto) return;
    const i = await inst(instId);
    i.bitacoraDiaria.push({id: uid('bit'), fecha: hoy(), texto, desvio});
    closeModal();
    await guardarYRefrescar(i);
  }

  // ---- Problemas ----
  function agregarProblema(instId){
    openModal('Registrar problema',
      '<label>Prioridad</label><select id="pPrioridad"><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select>'+
      '<label>Descripción</label><textarea id="pTexto" placeholder="Describe el problema..."></textarea>'+
      '<button class="btn-primary" onclick="App.Handlers._confirmarProblema(\''+instId+'\')">Registrar</button>'
    );
  }
  async function _confirmarProblema(instId){
    const prioridad = document.getElementById('pPrioridad').value;
    const texto = document.getElementById('pTexto').value.trim();
    if(!texto) return;
    const i = await inst(instId);
    i.problemas.push({id: uid('prob'), fecha: hoy(), prioridad, texto, estado:'abierto'});
    closeModal();
    await guardarYRefrescar(i);
  }
  async function toggleProblema(instId, itemId){
    const i = await inst(instId);
    const p = i.problemas.find(x=>x.id===itemId);
    if(p) p.estado = p.estado==='resuelto' ? 'abierto' : 'resuelto';
    await guardarYRefrescar(i);
  }

  // ---- Estados generales ----
  async function pasarACurso(instId){
    const i = await inst(instId);
    i.estado = 'curso';
    await App.Repo.guardar(i);
    App.Router.cambiarFase('durante');
  }
  async function marcarFinalizada(instId){
    const i = await inst(instId);
    i.estado = 'final';
    await App.Repo.guardar(i);
    App.Router.cambiarFase('despues');
  }

  // ---- PDF reporte interno ----
  async function generarReportePDF(instId){
    const i = await inst(instId);
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF();
    let y = 18;
    doc.setFontSize(16); doc.text('Reporte de Instalación', 14, y); y+=8;
    doc.setFontSize(11);
    doc.text('Proyecto: '+i.nombre, 14, y); y+=6;
    doc.text('Cliente: '+(i.cliente||'—'), 14, y); y+=6;
    doc.text('Ubicación: '+(i.ubicacion||'—'), 14, y); y+=6;
    doc.text('Estado: '+i.estado, 14, y); y+=10;

    doc.setFontSize(13); doc.text('Cronograma', 14, y); y+=7; doc.setFontSize(10);
    (i.cronograma||[]).forEach(a=>{
      doc.text('- '+a.nombre+' | est: '+a.horasEstimadas+'h'+(a.horasReales? ' | real: '+a.horasReales+'h':''), 14, y); y+=6;
      if(y>270){doc.addPage(); y=18;}
    });
    y+=4;
    doc.setFontSize(13); doc.text('Problemas', 14, y); y+=7; doc.setFontSize(10);
    (i.problemas||[]).forEach(p=>{
      doc.text('- ['+p.estado+'] '+p.texto.slice(0,80), 14, y); y+=6;
      if(y>270){doc.addPage(); y=18;}
    });
    y+=4;
    doc.setFontSize(13); doc.text('Bitácora diaria', 14, y); y+=7; doc.setFontSize(10);
    (i.bitacoraDiaria||[]).forEach(b=>{
      doc.text('- '+fmtFecha(b.fecha)+': '+b.texto.slice(0,80), 14, y); y+=6;
      if(y>270){doc.addPage(); y=18;}
    });

    doc.save('Reporte_'+i.nombre.replace(/\s+/g,'_')+'.pdf');
  }

  function limpiarFirma(canvasId){ App.SignaturePad.limpiar(canvasId); }

  async function generarActaPDF(instId){
    const i = await inst(instId);
    const fecha = document.getElementById('actaFecha').value;
    const obs = document.getElementById('actaObs').value.trim();
    const firmaCliente = App.SignaturePad.obtenerDataUrl('sigCliente');
    const firmaResponsable = App.SignaturePad.obtenerDataUrl('sigResponsable');

    if(!firmaCliente || !firmaResponsable){
      toast('Faltan firmas por capturar'); return;
    }

    i.acta = {observaciones:obs, firmaCliente, firmaResponsable, fechaEntrega:fecha};
    await App.Repo.guardar(i);

    const {jsPDF} = window.jspdf;
    const doc = new jsPDF();
    let y = 20;
    doc.setFontSize(17); doc.text('Acta de Entrega', 14, y); y+=10;
    doc.setFontSize(11);
    doc.text('Proyecto: '+i.nombre, 14, y); y+=6;
    doc.text('Cliente: '+(i.cliente||'—'), 14, y); y+=6;
    doc.text('Ubicación: '+(i.ubicacion||'—'), 14, y); y+=6;
    doc.text('Fecha de entrega: '+fmtFecha(fecha), 14, y); y+=10;

    doc.setFontSize(13); doc.text('Lo instalado', 14, y); y+=7; doc.setFontSize(10);
    (i.materiales||[]).forEach(m=>{ doc.text('- '+m.nombre, 14, y); y+=6; });
    y+=6;

    doc.setFontSize(13); doc.text('Observaciones del cliente', 14, y); y+=7; doc.setFontSize(10);
    const obsLines = doc.splitTextToSize(obs || 'Sin observaciones.', 180);
    doc.text(obsLines, 14, y); y += obsLines.length*5.5 + 10;

    if(y>220){ doc.addPage(); y=20; }
    doc.setFontSize(11); doc.text('Firma del cliente', 14, y);
    doc.text('Firma del responsable', 110, y);
    y+=4;
    doc.addImage(firmaCliente, 'PNG', 14, y, 80, 35);
    doc.addImage(firmaResponsable, 'PNG', 110, y, 80, 35);

    doc.save('Acta_Entrega_'+i.nombre.replace(/\s+/g,'_')+'.pdf');
    toast('Acta generada');
  }

  return {
    eliminarSub, guardarCotizacion,
    agregarChecklistItem, _confirmarChecklistItem, cargarChecklistEstandar, toggleChecklistGeneral,
    subirDocumento,
    limpiarFirma, generarActaPDF,
    agregarHerramientaPropia, _confirmarHerramientaPropia, toggleHerramientaPropia,
    agregarHerramientaSolicitar, _confirmarHerramientaSolicitar, toggleEstadoSolicitar,
    agregarHerramientaComprar, _confirmarHerramientaComprar,
    agregarMaterial, _confirmarMaterial, toggleMaterial,
    agregarTransporte, _confirmarTransporte, marcarEntregado,
    agregarPersonalFijo, _confirmarPersonalFijo, _crearYAsignarTrabajador, quitarPersonalFijo, _confirmarGrupoFijo,
    agregarPersonalExtra, _confirmarPersonalExtra,
    checar,
    agregarActividad, _confirmarActividad, completarActividad, _confirmarCompletar, reasignarActividad, _confirmarReasignar,
    configurarProduccion, _confirmarProduccion, agregarZona, _confirmarZona, registrarAvance, _confirmarAvance,
    agregarBitacora, _confirmarBitacora,
    agregarProblema, _confirmarProblema, toggleProblema,
    pasarACurso, marcarFinalizada,
    generarReportePDF
  };
})();

App.Views.dashboard = async function(){
  const {esc} = App.UIHelpers;
  const instalaciones = await App.Repo.listar();
  instalaciones.sort((a,b)=> (b.creado||'').localeCompare(a.creado||''));

  const curso = instalaciones.filter(i=>i.estado==='curso');
  const pendientes = instalaciones.filter(i=>i.estado==='pendiente');
  const finalizadas = instalaciones.filter(i=>i.estado==='final');
  const conProblemas = instalaciones.filter(i=> (i.problemas||[]).some(p=>p.estado==='abierto')).length;

  function tarjeta(inst){
    const avance = App.Repo.calcularAvance(inst);
    const abiertos = (inst.problemas||[]).filter(p=>p.estado==='abierto').length;
    const personalTotal = (inst.personalFijoIds||[]).length + (inst.personalExtra||[]).length;
    const stampClass = inst.estado==='curso'?'curso':(inst.estado==='final'?'final':'pendiente');
    const stampTxt = inst.estado==='curso'?'En curso':(inst.estado==='final'?'Finalizada':'Pendiente');
    const buscador = (inst.nombre+' '+(inst.cliente||'')+' '+(inst.ubicacion||'')).toLowerCase();
    return '<div class="proyecto-wrap" data-search="'+esc(buscador)+'" data-problema="'+(abiertos?'1':'0')+'">'+
    '<div class="card" onclick="App.Router.abrirInstalacion(\''+inst.id+'\')">'+
      '<div class="proyecto-top">'+
        '<div><div class="proyecto-nombre">'+esc(inst.nombre)+'</div>'+
        '<div class="proyecto-cliente">'+esc(inst.cliente||'Sin cliente')+'</div></div>'+
        '<span class="stamp '+stampClass+'">'+stampTxt+'</span>'+
      '</div>'+
      '<div class="proyecto-meta">'+
        '<div class="meta-item">📍 <b>'+esc(inst.ubicacion||'—')+'</b></div>'+
        '<div class="meta-item">👷 <b>'+personalTotal+'</b> personal</div>'+
        (abiertos? '<div class="meta-item">⚠️ <b>'+abiertos+'</b> problema(s)</div>' : '')+
      '</div>'+
      (inst.estado!=='pendiente' ? '<div class="progress-track"><div class="progress-fill '+(inst.estado==='final'?'done':'')+'" style="width:'+avance+'%"></div></div>' : '')+
    '</div></div>';
  }

  const html =
    '<div class="topbar">'+
      '<div class="eyebrow">Sistema de Instalaciones</div>'+
      '<h1>Panel General</h1>'+
      '<div class="sub">Isaac Zamora · Jefe de Instalaciones</div>'+
      '<button class="iconbtn" onclick="App.Router.abrirAjustes()">⚙️</button>'+
    '</div>'+
    '<div class="content">'+
      ((curso.length+pendientes.length)? '<div class="section-label">Accesos rápidos</div>'+
        '<div style="display:flex; gap:8px; margin-bottom:14px;">'+
          '<button class="btn-outline" style="margin:0; padding:12px 6px; font-size:11.5px;" onclick="App.Views.accesoRapido(\'checador\')">⏱️<br>Marcar hora</button>'+
          '<button class="btn-outline" style="margin:0; padding:12px 6px; font-size:11.5px;" onclick="App.Views.accesoRapido(\'problema\')">⚠️<br>Reportar problema</button>'+
          '<button class="btn-outline" style="margin:0; padding:12px 6px; font-size:11.5px;" onclick="App.Views.accesoRapido(\'bitacora\')">📝<br>Bitácora diaria</button>'+
        '</div>' : '')+
      '<input type="text" id="buscarProyecto" placeholder="Buscar por nombre, cliente o ciudad..." oninput="App.Views.filtrarProyectos(this.value)" style="margin-bottom:12px;">'+
      '<div class="kpi-row">'+
        '<div class="kpi" onclick="App.Views.filtrarProblemas(false)" style="cursor:pointer;"><div class="num">'+curso.length+'</div><div class="lbl">Activas</div></div>'+
        '<div class="kpi alert" onclick="App.Views.filtrarProblemas(true)" style="cursor:pointer;"><div class="num">'+conProblemas+'</div><div class="lbl">Con problemas</div></div>'+
        '<div class="kpi" onclick="App.Views.filtrarProblemas(false)" style="cursor:pointer;"><div class="num">'+finalizadas.length+'</div><div class="lbl">Finalizadas</div></div>'+
      '</div>'+
      (curso.length? '<div class="section-label">En curso</div>'+curso.map(tarjeta).join('') : '')+
      (pendientes.length? '<div class="section-label">Pendientes por salir</div>'+pendientes.map(tarjeta).join('') : '')+
      (finalizadas.length? '<div class="section-label">Finalizadas</div>'+finalizadas.map(tarjeta).join('') : '')+
      (!instalaciones.length? '<div class="empty">No tienes instalaciones todavía.<br>Toca el botón + para crear la primera.</div>' : '')+
      '<div class="empty" id="sinResultados" style="display:none;">Sin resultados</div>'+
    '</div>'+
    '<button class="fab" onclick="App.Router.nuevaInstalacion()">+</button>'+
    '<div class="tabbar">'+
      '<button class="tabbar-item active">🏠<div>Panel</div></button>'+
      '<button class="tabbar-item" onclick="App.Router.abrirPersonalGlobal()">👷<div>Personal</div></button>'+
      '<button class="tabbar-item" onclick="App.Router.abrirAjustes()">⚙️<div>Ajustes</div></button>'+
    '</div>';
  document.getElementById('app').innerHTML = html;
};

App.Views.filtrarProyectos = function(texto){
  const t = texto.trim().toLowerCase();
  let visibles = 0;
  document.querySelectorAll('.proyecto-wrap').forEach(el=>{
    const match = el.getAttribute('data-search').includes(t);
    el.style.display = match ? '' : 'none';
    if(match) visibles++;
  });
  const sinRes = document.getElementById('sinResultados');
  if(sinRes) sinRes.style.display = (t && visibles===0) ? '' : 'none';
};
App.Views.filtrarProblemas = function(soloConProblemas){
  let visibles = 0;
  document.querySelectorAll('.proyecto-wrap').forEach(el=>{
    const match = !soloConProblemas || el.getAttribute('data-problema')==='1';
    el.style.display = match ? '' : 'none';
    if(match) visibles++;
  });
  const buscador = document.getElementById('buscarProyecto');
  if(buscador) buscador.value = '';
  const sinRes = document.getElementById('sinResultados');
  if(sinRes) sinRes.style.display = visibles===0 ? '' : 'none';
};

App.Views.accesoRapido = async function(tipo){
  const {esc, openModal, closeModal} = App.UIHelpers;
  const todas = await App.Repo.listar();
  const activas = todas.filter(i=>i.estado==='curso' || i.estado==='pendiente');
  if(!activas.length){ App.UIHelpers.toast('No tienes instalaciones activas'); return; }

  async function ejecutar(instId){
    closeModal();
    if(tipo==='checador'){
      await App.Router.abrirInstalacion(instId);
      await App.Router.cambiarFase('durante');
    } else if(tipo==='problema'){
      await App.Router.abrirInstalacion(instId);
      App.Handlers.agregarProblema(instId);
    } else if(tipo==='bitacora'){
      await App.Router.abrirInstalacion(instId);
      App.Handlers.agregarBitacora(instId);
    }
  }

  if(activas.length===1){
    ejecutar(activas[0].id);
    return;
  }
  const opciones = activas.map(i=>'<button class="btn-outline" onclick="App.Views._ejecutarAccesoRapido(\''+tipo+'\',\''+i.id+'\')">'+esc(i.nombre)+'</button>').join('');
  openModal('¿En qué instalación?', opciones);
  App.Views._ejecutarAccesoRapido = (t,id)=> ejecutar(id);
};

/* ===================== ROUTER ===================== */
App.Router = (function(){
  let instActualId = null;
  let faseActual = 'antes';

  function irDashboard(){ instActualId=null; App.Views.dashboard(); }

  function nuevaInstalacion(){
    const {openModal, closeModal} = App.UIHelpers;
    openModal('Nueva instalación',
      '<label>Nombre del proyecto</label><input type="text" id="fNombre" placeholder="Ej. Residencial Altavista">'+
      '<label>Cliente</label><input type="text" id="fCliente" placeholder="Nombre del cliente">'+
      '<label>Ubicación</label><input type="text" id="fUbicacion" placeholder="Ciudad / dirección">'+
      '<label>Fecha de inicio</label><input type="date" id="fFecha" value="'+hoy()+'">'+
      '<button class="btn-primary" onclick="App.Router._crearInstalacion()">Crear instalación</button>'
    );
  }
  async function _crearInstalacion(){
    const nombre = document.getElementById('fNombre').value.trim();
    if(!nombre){ App.UIHelpers.toast('Ponle un nombre al proyecto'); return; }
    const cliente = document.getElementById('fCliente').value.trim();
    const ubicacion = document.getElementById('fUbicacion').value.trim();
    const fechaInicio = document.getElementById('fFecha').value;
    const inst = await App.Repo.nuevaInstalacion({nombre, cliente, ubicacion, fechaInicio});
    App.UIHelpers.closeModal();
    abrirInstalacion(inst.id);
  }

  async function abrirInstalacion(id){
    instActualId = id;
    const inst = await App.Repo.obtener(id);
    faseActual = inst.estado==='curso' ? 'durante' : (inst.estado==='final' ? 'despues' : 'antes');
    App.Views.detalle(inst, faseActual);
  }

  async function cambiarFase(fase){
    faseActual = fase;
    const inst = await App.Repo.obtener(instActualId);
    App.Views.detalle(inst, fase);
  }

  async function instActual(){ return App.Repo.obtener(instActualId); }

  async function refrescar(){
    const inst = await App.Repo.obtener(instActualId);
    App.Views.detalle(inst, faseActual);
  }

  function abrirAjustes(){
    App.Views.ajustes();
  }
  function abrirPersonalGlobal(){
    App.Views.personalGlobal();
  }
  function abrirTareas(tipo, id, nombre){
    App.Views.tareas(tipo, id, nombre);
  }
  function abrirHorasGlobales(){
    App.Views.horasGlobales();
  }

  async function abrirActa(id){
    instActualId = id;
    const i = await App.Repo.obtener(id);
    App.Views.acta(i);
  }

  return {
    irDashboard, nuevaInstalacion, _crearInstalacion, abrirInstalacion,
    cambiarFase, instActual, refrescar, abrirAjustes, abrirPersonalGlobal, abrirActa, abrirTareas, abrirHorasGlobales
  };
})();
