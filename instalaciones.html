<style>
:root{
  --fondo:#22262A; --fondo-alt:#333934; --texto:#F5F6F4; --texto-suave:#9AA39C;
  --acento:#2FD9CE; --acento-fuerte:#1FBDB2; --info:#7C9CBF; --info-fondo:#2A3742;
  --exito:#4ADE80; --exito-fondo:#1F3A2A; --peligro:#FF6B6B; --peligro-fondo:#3D2426;
  --borde:#3A3F3B; --superficie:#2B302E;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--fondo); color:var(--texto); font-family:'Inter',sans-serif;

input,select,textarea,button{font-family:inherit; font-size:16px;} /* evita auto-zoom iOS */
button{cursor:pointer;}
button svg{width:18px; height:18px;} /* evita SVG a tama\u00f1o gigante en Safari */
#app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:86px;}

.topbar{padding:calc(env(safe-area-inset-top) + 16px) 20px 16px; background:var(--superficie); color:var(--texto); border-bottom:1px solid var(--borde); position:relative;}
.topbar .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--acento); font-weight:600;}
.topbar h1{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:600; margin:4px 0 0;}
.topbar .sub{font-size:12.5px; color:var(--texto-suave); margin-top:4px;}
.iconbtn{position:absolute; top:calc(env(safe-area-inset-top) + 16px); right:18px; background:none; border:none; color:var(--texto); font-size:20px;}

.content{padding:16px 16px 6px;}
.section-label{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--texto-suave); margin:16px 0 10px; display:flex; align-items:center; gap:8px;}
.section-label::after{content:''; flex:1; height:1px; background:var(--borde);}

.kpi-row{display:flex; gap:10px;}
.kpi{flex:1 1 28%; background:var(--superficie); border:1px solid var(--borde); border-radius:10px; padding:10px 6px; text-align:center;}

.card.st-curso{border-left:3px solid var(--acento);}
.card.st-pendiente{border-left:3px solid var(--info);}
.card.st-final{border-left:3px solid var(--exito);}

.proyecto-cliente{font-size:12.5px; color:var(--texto-suave); margin-top:2px;}
.proyecto-meta{display:flex; gap:14px; margin-top:12px; flex-wrap:wrap;}

.dot-live{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--acento); box-shadow:0 0 6px var(--acento); margin-right:5px;}

.fab{position:fixed; bottom:96px; right:calc(50% - 260px + 20px); width:56px; height:56px; border-radius:16px; background:var(--acento); display:flex; align-items:center; justify-content:center; color:var(--fondo); font-size:28px; border:none; box-shadow:0 8px 20px rgba(47,217,206,0.35); z-index:20;}

.tabbar{position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; height:calc(70px + env(safe-area-inset-bottom)); background:var(--superficie); border-top:1px solid var(--borde); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20;}
.tabbar-item{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; font-weight:600; color:var(--texto-suave); background:none; border:none;}
.tabbar-item.active{color:var(--acento-fuerte);}

.back{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--acento); font-weight:600; background:none; border:none; padding:0;}

.det-cliente{font-size:13px; color:var(--texto-suave);}

.phase-tabs{display:flex; gap:6px; margin:16px 16px 0; background:var(--fondo-alt); padding:4px; border-radius:10px;}
.phase-tab{flex:1; text-align:center; padding:9px 4px; border-radius:7px; font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; color:var(--texto-suave); background:none; border:none;}

.card h3{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between;}
.card h3 span.count{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--texto-suave); font-weight:500;}

.check-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--borde); font-size:13.5px;}
.check-row:last-child{border-bottom:none;}

.check-tag.ok{background:var(--exito-fondo); color:var(--exito);}

input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%; padding:10px 11px; border:1px solid var(--borde); border-radius:8px; background:var(--fondo); color:var(--texto); margin-bottom:8px;
}
textarea{min-height:70px; resize:vertical;}
label{font-size:11.5px; font-weight:600; color:var(--texto-suave); display:block; margin-bottom:4px;}

.btn-primary{display:block; text-align:center; background:var(--acento); color:var(--fondo); font-weight:700; padding:13px; border-radius:10px; font-size:14px; margin-top:4px; border:none; width:100%;}
.btn-outline{display:block; text-align:center; background:transparent; color:var(--texto); font-weight:600; padding:12px; border-radius:10px; font-size:13.5px; border:1.5px solid var(--borde); width:100%; margin-top:8px;}
.btn-danger{color:var(--peligro); border-color:var(--peligro-fondo);}

.clock-widget{background:var(--superficie); border:1px solid var(--borde); border-radius:12px; padding:18px; text-align:center; margin-bottom:12px;}
.clock-time{font-family:'JetBrains Mono',monospace; font-size:34px; color:var(--acento); font-weight:600; letter-spacing:1px;}
.clock-label{font-size:11.5px; color:var(--texto-suave); margin-top:2px; letter-spacing:0.5px;}
.clock-btn{margin-top:14px; background:var(--acento); color:var(--fondo); border:none; border-radius:9px; padding:12px 0; width:100%; font-weight:700; font-size:14px;}

.worker-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--borde);}
.worker-row:last-child{border-bottom:none;}
.avatar{width:32px; height:32px; border-radius:8px; background:var(--info-fondo); color:var(--info); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'Space Grotesk',sans-serif; flex-shrink:0;}
.avatar.extra{background:var(--fondo-alt); color:var(--texto-suave);}
.worker-name{font-size:13.5px; font-weight:600; flex:1;}
.worker-hrs{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--texto-suave);}
.worker-status{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.worker-status.in{background:var(--exito);}
.worker-status.out{background:var(--borde);}

.problema-card{border-left:3px solid var(--peligro); padding:10px 12px; background:var(--peligro-fondo); border-radius:0 8px 8px 0; margin-bottom:8px;}
.problema-card.resuelto{border-left-color:var(--exito); background:var(--exito-fondo);}
.problema-top{display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; color:var(--peligro);}
.problema-card.resuelto .problema-top{color:var(--exito);}
.problema-txt{font-size:12.5px; color:var(--texto); margin-top:4px; line-height:1.4;}

.bitacora-entry{border-left:3px solid var(--info); padding:8px 12px; background:var(--info-fondo); border-radius:0 8px 8px 0; margin-bottom:8px;}
.bitacora-fecha{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--info); font-weight:600;}
.bitacora-txt{font-size:12.5px; margin-top:4px; line-height:1.4;}

.ai-tag{font-size:10.5px; color:var(--info); margin-top:5px; display:flex; align-items:center; gap:5px;}
.envio-card{border:1px solid var(--borde); border-radius:9px; padding:11px; margin-bottom:9px;}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:flex-end;}
.modal-sheet{background:var(--fondo); width:100%; max-width:520px; margin:0 auto; border-radius:18px 18px 0 0; max-height:88vh; overflow-y:auto; padding:20px 18px calc(24px + env(safe-area-inset-bottom));}
.modal-title{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600; margin-bottom:14px;}

.sig-pad{background:#F5F6F4; border:1.5px dashed var(--borde); border-radius:8px; height:130px; width:100%; touch-action:none; display:block;}
.sig-actions{display:flex; gap:8px; margin-top:6px;}
.sig-actions button{flex:1;}

.empty{text-align:center; padding:40px 20px; color:var(--texto-suave); font-size:13px;}

.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--texto); color:var(--fondo); padding:10px 18px; border-radius:20px; font-size:13px; z-index:200; box-shadow:0 6px 16px rgba(0,0,0,0.25);}
</style>

<body>
<div id="app"></div>
<script>
window.App = window.App || {};

/* ===================== STORAGE (IndexedDB) ===================== */
App.Storage = (function(){
  const DB_NAME = 'instalaciones_db';
  const DB_VERSION = 2;
  let dbPromise = null;

  function open(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('instalaciones')){
          db.createObjectStore('instalaciones', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('trabajadores')){
          db.createObjectStore('trabajadores', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('herramientasCatalogo')){
          db.createObjectStore('herramientasCatalogo', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('actividadesCatalogo')){
          db.createObjectStore('actividadesCatalogo', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('gruposTrabajo')){
          db.createObjectStore('gruposTrabajo', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('config')){
          db.createObjectStore('config', {keyPath:'key'});
        }
      };
      req.onsuccess = (e)=> resolve(e.target.result);
      req.onerror = (e)=> reject(e.target.error);
    });
    return dbPromise;
  }

  function tx(storeName, mode){
    return open().then(db=> db.transaction(storeName, mode).objectStore(storeName));
  }

  function getAll(storeName){
    return tx(storeName,'readonly').then(store=> new Promise((res,rej)=>{
      const r = store.getAll();
      r.onsuccess = ()=> res(r.result || []);
      r.onerror = ()=> rej(r.error);
    }));
  }
  function get(storeName, id){
    return tx(storeName,'readonly').then(store=> new Promise((res,rej)=>{
      const r = store.get(id);
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> rej(r.error);
    }));
  }
  function put(storeName, obj){
    return tx(storeName,'readwrite').then(store=> new Promise((res,rej)=>{
      const r = store.put(obj);
      r.onsuccess = ()=> res(obj);
      r.onerror = ()=> rej(r.error);
    }));
  }
  function del(storeName, id){
    return tx(storeName,'readwrite').then(store=> new Promise((res,rej)=>{
      const r = store.delete(id);
      r.onsuccess = ()=> res(true);
      r.onerror = ()=> rej(r.error);
    }));
  }

  return {getAll, get, put, delete: del};
})();

function uid(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hoy(){ return new Date().toISOString().slice(0,10); }
function horaAhora(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function fmtFecha(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }

/* ===================== REPOSITORY ===================== */
App.Repo = (function(){
  const S = App.Storage;

  function nuevaInstalacion(data){
    const inst = {
      id: uid('inst'),
      nombre: data.nombre || 'Instalación sin nombre',
      cliente: data.cliente || '',
      ubicacion: data.ubicacion || '',
      fechaInicio: data.fechaInicio || hoy(),
      fechaFinPlan: data.fechaFinPlan || '',
      cotizacionRef: '',
      estado: 'pendiente', // pendiente | curso | final
      herramientasPropias: [], // {id,nombre,llevar:bool}
      herramientasSolicitar: [], // {id,nombre,estado:'pendiente'|'enviado'}
      herramientasComprar: [], // {id,nombre,costo}
      materiales: [], // {id,nombre,cantidad,estado:'pendiente'|'entregado'}
      transporte: [], // {id,modo,empresa,solicitado,carga,llegadaEst,llegadaReal,costo,estado}
      personalFijoIds: [], // ids de App.Repo trabajadores catálogo
      personalExtra: [], // {id,nombre,ciudad}
      registroHoras: [], // {id, trabajadorId, esExtra:bool, fecha, entrada, salida}
      cronograma: [], // {id,nombre,fechaInicio,fechaFin,horasEstimadas,origen,horasReales,completada,asignado}
      produccion: { unidadNombre:'', unidadTotal:0, metaSemanal:0, zonas: [] }, // zonas: {id,nombre,cantidadRequerida}
      avanceRegistros: [], // {id,fecha,zonaId,cantidad,asignado:{tipo,id,nombre},nota}
      documentos: [], // {id,nombre,tipo,dataUrl,fecha}
      checklistGeneral: [], // {id,texto,hecho,fechaCompletado}
      bitacoraDiaria: [], // {id,fecha,texto,desvio:bool}
      problemas: [], // {id,fecha,prioridad,texto,estado:'abierto'|'resuelto'}
      acta: {observaciones:'', firmaCliente:null, firmaResponsable:null, fechaEntrega:''},
      creado: new Date().toISOString()
    };
    return S.put('instalaciones', inst);
  }

  function guardar(inst){ return S.put('instalaciones', inst); }
  function obtener(id){ return S.get('instalaciones', id); }
  function listar(){ return S.getAll('instalaciones'); }
  function eliminar(id){ return S.delete('instalaciones', id); }

  // Catálogos reutilizables
  function catalogoTrabajadores(){ return S.getAll('trabajadores'); }
  function agregarTrabajador(nombre, rol){
    const t = {id: uid('trab'), nombre, rol: rol||'', activo:true};
    return S.put('trabajadores', t);
  }
  function catalogoHerramientas(){ return S.getAll('herramientasCatalogo'); }
  function agregarHerramientaCatalogo(nombre){
    const h = {id: uid('herr'), nombre};
    return S.put('herramientasCatalogo', h);
  }
  function catalogoActividades(){ return S.getAll('actividadesCatalogo'); }
  function agregarActividadCatalogo(nombre){
    const a = {id: uid('act'), nombre};
    return S.put('actividadesCatalogo', a);
  }
  function catalogoGrupos(){ return S.getAll('gruposTrabajo'); }
  function agregarGrupo(nombre, miembros){
    const g = {id: uid('grp'), nombre, miembros: miembros||[]};
    return S.put('gruposTrabajo', g);
  }
  function guardarGrupo(g){ return S.put('gruposTrabajo', g); }
  function eliminarGrupo(id){ return S.delete('gruposTrabajo', id); }

  // Tareas (actividades de cronograma) asignadas a un trabajador o grupo, a través de todas las instalaciones
  async function tareasDe(tipo, id){
    const todas = await listar();
    const resultado = [];
    todas.forEach(inst=>{
      (inst.cronograma||[]).forEach(a=>{
        if(a.asignado && a.asignado.tipo===tipo && a.asignado.id===id){
          resultado.push({instalacionId: inst.id, instalacionNombre: inst.nombre, actividad: a});
        }
      });
    });
    return resultado;
  }

  function config(key){ return S.get('config', key); }
  function setConfig(key, value){ return S.put('config', {key, value}); }

  // KPIs
  function calcularAvance(inst){
    if(!inst.cronograma.length) return 0;
    const conReal = inst.cronograma.filter(a=>a.completada).length;
    return Math.round((conReal/inst.cronograma.length)*100);
  }
  function totalHoras(inst, trabajadorKey){
    let mins = 0;
    inst.registroHoras.forEach(r=>{
      const key = r.esExtra? r.trabajadorId : r.trabajadorId;
      if(trabajadorKey && key!==trabajadorKey) return;
      if(r.entrada && r.salida){
        const [eh,em]=r.entrada.split(':').map(Number);
        const [sh,sm]=r.salida.split(':').map(Number);
        mins += (sh*60+sm)-(eh*60+em);
      }
    });
    return mins;
  }
  function fmtMinutos(mins){
    if(mins<=0) return '0h 0m';
    const h = Math.floor(mins/60), m = mins%60;
    return h+'h '+m+'m';
  }

  // Producción por unidades (ej. puertas, zonas/pisos, avance semanal)
  function numSemanaISO(fechaStr){
    const d = new Date(fechaStr+'T00:00:00');
    const target = new Date(d.valueOf());
    const dayNr = (d.getDay()+6)%7;
    target.setDate(target.getDate()-dayNr+3);
    const firstThursday = new Date(target.getFullYear(),0,4);
    const diff = target - firstThursday;
    const semana = 1 + Math.round(diff/(7*24*3600*1000));
    return target.getFullYear()+'-S'+semana;
  }
  function calcularProduccion(inst){
    const regs = inst.avanceRegistros||[];
    const totalInstalado = regs.reduce((a,r)=>a+(r.cantidad||0),0);
    const porZona = {};
    regs.forEach(r=>{ porZona[r.zonaId] = (porZona[r.zonaId]||0)+r.cantidad; });
    const semanaActual = numSemanaISO(hoy());
    const instaladoSemana = regs.filter(r=> numSemanaISO(r.fecha)===semanaActual).reduce((a,r)=>a+r.cantidad,0);
    const unidadTotal = (inst.produccion&&inst.produccion.unidadTotal)||0;
    const pct = unidadTotal>0 ? Math.round(totalInstalado/unidadTotal*100) : 0;
    return {totalInstalado, porZona, instaladoSemana, pct, unidadTotal};
  }

  async function horasDetalladas(){
    const todas = await listar();
    const cat = await catalogoTrabajadores();
    const cfg = await config('miNombre');
    const miNombre = cfg ? cfg.value : 'Isaac Zamora';
    const acumulado = {};
    todas.forEach(inst=>{
      (inst.registroHoras||[]).forEach(r=>{
        if(!r.entrada || !r.salida) return;
        const [eh,em]=r.entrada.split(':').map(Number);
        const [sh,sm]=r.salida.split(':').map(Number);
        const min = (sh*60+sm)-(eh*60+em);
        if(min<=0) return;
        let key, nombre;
        if(r.trabajadorId==='YO'){ key='YO'; nombre=miNombre+' (tú)'; }
        else if(r.esExtra){
          const p = (inst.personalExtra||[]).find(x=>x.id===r.trabajadorId);
          key = 'extra|'+r.trabajadorId; nombre = p?p.nombre:'—';
        } else {
          const t = cat.find(x=>x.id===r.trabajadorId);
          key = 'fijo|'+r.trabajadorId; nombre = t?t.nombre:'—';
        }
        if(!acumulado[key]) acumulado[key] = {nombre, minutos:0, entradas:[]};
        acumulado[key].minutos += min;
        acumulado[key].entradas.push({fecha:r.fecha, proyecto:inst.nombre, entrada:r.entrada, salida:r.salida, minutos:min});
      });
    });
    Object.values(acumulado).forEach(p=> p.entradas.sort((a,b)=> a.fecha.localeCompare(b.fecha)));
    return acumulado;
  }

  const STORES = ['instalaciones','trabajadores','herramientasCatalogo','actividadesCatalogo','gruposTrabajo','config'];

  async function exportarTodo(){
    const data = {version:1, fecha:new Date().toISOString(), stores:{}};
    for(const nombre of STORES){
      data.stores[nombre] = await S.getAll(nombre);
    }
    return data;
  }

  async function importarTodo(data){
    if(!data || !data.stores) throw new Error('Formato de respaldo inválido');
    for(const nombre of STORES){
      const items = data.stores[nombre];
      if(Array.isArray(items)){
        for(const item of items){
          await S.put(nombre, item);
        }
      }
    }
  }

  async function reiniciarTodo(){
    for(const nombre of STORES){
      const items = await S.getAll(nombre);
      for(const item of items){
        const key = item.id || item.key;
        if(key) await S.delete(nombre, key);
      }
    }
  }

  return {
    nuevaInstalacion, guardar, obtener, listar, eliminar,
    catalogoTrabajadores, agregarTrabajador,
    catalogoHerramientas, agregarHerramientaCatalogo,
    catalogoActividades, agregarActividadCatalogo,
    catalogoGrupos, agregarGrupo, guardarGrupo, eliminarGrupo, tareasDe,
    config, setConfig,
    calcularAvance, totalHoras, fmtMinutos,
    calcularProduccion, numSemanaISO, horasDetalladas,
    exportarTodo, importarTodo, reiniciarTodo
  };
})();

/* ===================== IA - Sugerencia de tiempos ===================== */
App.IA = (function(){

  async function historialActividad(nombreActividad){
    const todas = await App.Repo.listar();
    const registros = [];
    todas.forEach(inst=>{
      (inst.cronograma||[]).forEach(a=>{
        if(a.nombre.trim().toLowerCase() === nombreActividad.trim().toLowerCase() && a.horasReales){
          registros.push(a.horasReales);
        }
      });
    });
    return registros;
  }

  async function sugerirTiempo(nombreActividad){
    const historial = await historialActividad(nombreActividad);
    if(historial.length){
      const prom = historial.reduce((a,b)=>a+b,0)/historial.length;
      return {
        horas: Math.round(prom*10)/10,
        origen: 'ia_historial',
        nota: 'Basado en '+historial.length+' instalación(es) similares tuyas'
      };
    }
    // sin historial propio: pedir estimado general a la API
    const apiKeyCfg = await App.Repo.config('anthropicApiKey');
    const apiKey = apiKeyCfg ? apiKeyCfg.value : null;
    if(!apiKey){
      return {horas: 2, origen:'ia_general', nota:'Estimado por defecto (configura tu API key en Ajustes para estimaciones más precisas)'};
    }
    try{
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key': apiKey,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:100,
          messages:[{role:'user', content:'Eres un experto en instalación de muebles y closets a la medida. Da SOLO un número (puede tener un decimal) que represente las horas estimadas típicas para completar esta actividad de instalación: "'+nombreActividad+'". Responde solo el número, nada más.'}]
        })
      });
      const data = await resp.json();
      const texto = (data.content && data.content[0] && data.content[0].text) || '2';
      const horas = parseFloat(texto.match(/[\d.]+/)?.[0] || '2');
      return {horas: horas || 2, origen:'ia_general', nota:'Estimado general de IA (sin historial propio todavía)'};
    }catch(err){
      return {horas: 2, origen:'ia_general', nota:'No se pudo consultar IA — estimado por defecto'};
    }
  }

  return {sugerirTiempo};
})();

/* ===================== CHARTS (SVG inline) ===================== */
App.Charts = (function(){
  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function diasEntre(a,b){
    const da = new Date(a+'T00:00:00'), db = new Date(b+'T00:00:00');
    return Math.round((db-da)/(24*3600*1000));
  }
  function estadoActividad(a, hoyStr){
    if(a.completada) return 'completada';
    if(!a.fechaFin) return 'sinfecha';
    if(hoyStr > a.fechaFin) return 'atrasada';
    if(hoyStr >= a.fechaInicio) return 'encurso';
    return 'pendiente';
  }
  const COLOR_ESTADO = {completada:'var(--exito)', atrasada:'var(--peligro)', encurso:'var(--acento)', pendiente:'var(--texto-suave)', sinfecha:'var(--texto-suave)'};
  const LABEL_ESTADO = {completada:'Completada', atrasada:'Atrasada', encurso:'En curso', pendiente:'Pendiente', sinfecha:'Sin fecha'};

  function calcularRiesgo(inst){
    const acts = inst.cronograma||[];
    const hoyStr = new Date().toISOString().slice(0,10);
    const conFecha = acts.filter(a=>a.fechaInicio && a.fechaFin);
    const atrasadas = conFecha.filter(a=> !a.completada && hoyStr>a.fechaFin).length;
    let enRiesgoPlazo = false, finMasTardio = null;
    if(conFecha.length && inst.fechaFinPlan){
      finMasTardio = conFecha.reduce((max,a)=> a.fechaFin>max?a.fechaFin:max, conFecha[0].fechaFin);
      enRiesgoPlazo = finMasTardio > inst.fechaFinPlan;
    }
    return {enRiesgo: atrasadas>0 || enRiesgoPlazo, atrasadas, enRiesgoPlazo, finMasTardio, finProyecto: inst.fechaFinPlan||null};
  }

  function timelineCronograma(inst){
    const acts = (inst.cronograma||[]).slice();
    if(!acts.length) return {html:'', feasibilidad:null};
    const hoyStr = new Date().toISOString().slice(0,10);
    const conFecha = acts.filter(a=>a.fechaInicio && a.fechaFin).sort((a,b)=>a.fechaInicio.localeCompare(b.fechaInicio));
    const sinFecha = acts.filter(a=>!(a.fechaInicio && a.fechaFin));
    const riesgo = calcularRiesgo(inst);
    const feasibilidad = (conFecha.length && (inst.fechaFinPlan || riesgo.atrasadas>0)) ? riesgo : null;
    let html = '<div style="position:relative; padding-left:20px;">';
    html += '<div style="position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--borde);"></div>';
    conFecha.forEach(a=>{
      const estado = estadoActividad(a, hoyStr);
      const c = COLOR_ESTADO[estado];
      html += '<div style="position:relative; margin-bottom:16px;">'+
        '<div style="position:absolute; left:-20px; top:2px; width:11px; height:11px; border-radius:50%; background:'+c+';"></div>'+
        '<div style="display:flex; justify-content:space-between; align-items:baseline;">'+
          '<div style="font-size:13px; font-weight:600;">'+esc(a.nombre)+'</div>'+
          '<span style="font-family:\'JetBrains Mono\',monospace; font-size:9.5px; font-weight:700; color:'+c+';">'+LABEL_ESTADO[estado].toUpperCase()+'</span>'+
        '</div>'+
        '<div style="font-family:\'JetBrains Mono\',monospace; font-size:10.5px; color:var(--texto-suave); margin-top:2px;">'+
          fmtFecha(a.fechaInicio)+' → '+fmtFecha(a.fechaFin)+(a.horasReales!=null? ' · real '+a.horasReales+'h':' · '+a.horasEstimadas+'h est.')+
        '</div>'+
        (a.asignado? '<div style="font-size:11px; color:var(--info); margin-top:2px;">'+(a.asignado.tipo==='grupo'?'👥 ':'👤 ')+esc(a.asignado.nombre)+'</div>':'')+
        '<div style="display:flex; gap:8px; margin-top:6px;">'+
          '<button class="btn-outline" style="margin:0; padding:5px 9px; font-size:10.5px;" onclick="App.Handlers.reasignarActividad(\''+inst.id+'\',\''+a.id+'\')">Reasignar</button>'+
          (!a.completada? '<button class="btn-outline" style="margin:0; padding:5px 9px; font-size:10.5px;" onclick="App.Handlers.completarActividad(\''+inst.id+'\',\''+a.id+'\')">Completar</button>':'')+
          '<button class="check-del" onclick="App.Handlers.eliminarSub(\''+inst.id+'\',\'cronograma\',\''+a.id+'\')">✕</button>'+
        '</div>'+
      '</div>';
    });
    html += '</div>';
    if(sinFecha.length){
      html += '<div style="font-size:10.5px; color:var(--texto-suave); margin:4px 0 6px;">Sin fechas asignadas:</div>';
      sinFecha.forEach(a=>{
        html += '<div class="envio-card">'+
          '<div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600;"><span>'+esc(a.nombre)+'</span><span style="color:var(--texto-suave); font-weight:500;">'+a.horasEstimadas+'h est.</span></div>'+
          (a.asignado? '<div style="font-size:11px; color:var(--info); margin-top:2px;">'+(a.asignado.tipo==='grupo'?'👥 ':'👤 ')+esc(a.asignado.nombre)+'</div>':'')+
          '<div style="display:flex; gap:8px; margin-top:6px;">'+
            '<button class="btn-outline" style="margin:0; padding:5px 9px; font-size:10.5px;" onclick="App.Handlers.reasignarActividad(\''+inst.id+'\',\''+a.id+'\')">Reasignar</button>'+
            (!a.completada? '<button class="btn-outline" style="margin:0; padding:5px 9px; font-size:10.5px;" onclick="App.Handlers.completarActividad(\''+inst.id+'\',\''+a.id+'\')">Completar</button>':'')+
            '<button class="check-del" onclick="App.Handlers.eliminarSub(\''+inst.id+'\',\'cronograma\',\''+a.id+'\')">✕</button>'+
          '</div>'+
        '</div>';
      });
    }
    return {html, feasibilidad};
  }

  function turnoBarra(entrada, salida){
    // escala visible 6:00 a 20:00 (14 horas)
    const INICIO=6, FIN=20, RANGO=FIN-INICIO;
    function pct(hhmm){
      const [h,m]=hhmm.split(':').map(Number);
      return Math.min(Math.max((h+m/60-INICIO)/RANGO*100, 0), 100);
    }
    const left = pct(entrada);
    const right = salida ? pct(salida) : 100;
    const width = Math.max(right-left, 2);
    return '<div style="position:relative; height:8px; background:var(--fondo-alt); border-radius:4px; margin:4px 0;">'+
      '<div style="position:absolute; left:'+left+'%; width:'+width+'%; height:100%; background:'+(salida?'var(--acento)':'var(--exito)')+'; border-radius:4px;"></div>'+
    '</div>';
  }

  function turnosPorDia(entradas, limite){
    const lista = entradas.slice().reverse().slice(0, limite||7);
    if(!lista.length) return '<div class="empty" style="padding:14px 0;">Sin turnos registrados</div>';
    return lista.map(e=>{
      const h = Math.floor(e.minutos/60), m = e.minutos%60;
      return '<div style="margin-bottom:10px;">'+
        '<div style="display:flex; justify-content:space-between; font-size:11.5px;">'+
          '<span style="font-weight:600;">'+fmtFecha(e.fecha)+'</span>'+
          '<span style="font-family:\'JetBrains Mono\',monospace; color:var(--texto-suave);">'+e.entrada+' – '+e.salida+' · '+h+'h '+m+'m</span>'+
        '</div>'+
        turnoBarra(e.entrada, e.salida)+
      '</div>';
    }).join('');
  }

  function barrasHoras(datos){
    if(!datos.length) return '<div class="empty" style="padding:14px 0;">Sin horas registradas</div>';
    const max = Math.max(...datos.map(d=>d.minutos), 1);
    return datos.map(d=>{
      const w = Math.max(Math.round(d.minutos/max*100), 2);
      const horas = Math.floor(d.minutos/60), mins = d.minutos%60;
      return '<div style="margin-bottom:9px;">'+
        '<div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; margin-bottom:3px;">'+
          '<span>'+esc(d.nombre)+'</span><span style="font-family:\'JetBrains Mono\',monospace; color:var(--texto-suave);">'+horas+'h '+mins+'m</span>'+
        '</div>'+
        '<div style="background:var(--fondo-alt); border-radius:5px; height:12px; overflow:hidden;">'+
          '<div style="background:var(--acento); height:100%; width:'+w+'%; border-radius:5px;"></div>'+
        '</div></div>';
    }).join('');
  }

  return {timelineCronograma, barrasHoras, turnosPorDia, turnoBarra, calcularRiesgo};
})();

App.Views.faseDurante = async function(inst){
  const {esc} = App.UIHelpers;
  const trabajadoresCat = await App.Repo.catalogoTrabajadores();
  const hoyStr = hoy();

  function personaInfo(id, esExtra){
    if(esExtra){
      const p = (inst.personalExtra||[]).find(x=>x.id===id);
      return p? p.nombre : '—';
    }
    const t = trabajadoresCat.find(x=>x.id===id);
    return t? t.nombre : '—';
  }

  function estadoHoy(id, esExtra){
    const hoyStr = hoy();
    const reg = (inst.registroHoras||[]).filter(r=> r.trabajadorId===id && r.esExtra===!!esExtra && r.fecha===hoyStr);
    const abierto = reg.find(r=> r.entrada && !r.salida);
    return {abierto, registros: reg};
  }

  function filaChecador(id, esExtra){
    const nombre = personaInfo(id, esExtra);
    const {abierto} = estadoHoy(id, esExtra);
    const totalMin = App.Repo.totalHoras({registroHoras:(inst.registroHoras||[]).filter(r=>r.trabajadorId===id && r.esExtra===!!esExtra)});
    return '<div class="worker-row">'+
      '<div class="worker-status '+(abierto?'in':'out')+'"></div>'+
      '<div class="avatar '+(esExtra?'extra':'')+'" style="width:26px;height:26px;font-size:11px;">'+iniciales(nombre)+'</div>'+
      '<div class="worker-name">'+esc(nombre)+'</div>'+
      '<div class="worker-hrs">'+App.Repo.fmtMinutos(totalMin)+'</div>'+
      '<button class="btn-outline" style="margin:0; width:auto; padding:6px 10px; font-size:11.5px;" onclick="App.Handlers.checar(\''+inst.id+'\',\''+id+'\','+(!!esExtra)+')">'+(abierto?'Salida':'Entrada')+'</button>'+
    '</div>';
  }

  const personalRows = (inst.personalFijoIds||[]).map(id=>filaChecador(id,false)).join('') +
    (inst.personalExtra||[]).map(p=>filaChecador(p.id,true)).join('');

  const yo = await App.Repo.config('miNombre');
  const miNombre = yo ? yo.value : 'Isaac Zamora';
  const miEstado = estadoHoy('YO', false);
  // registro propio se guarda con trabajadorId 'YO'
  const abiertoYo = (inst.registroHoras||[]).find(r=> r.trabajadorId==='YO' && r.fecha===hoy() && r.entrada && !r.salida);
  const minYo = App.Repo.totalHoras({registroHoras:(inst.registroHoras||[]).filter(r=>r.trabajadorId==='YO')});

  const avance = App.Repo.calcularAvance(inst);
  const completadas = (inst.cronograma||[]).filter(a=>a.completada).length;

  const datosHoras = [];
  (inst.personalFijoIds||[]).forEach(id=>{
    const t = trabajadoresCat.find(x=>x.id===id);
    const min = App.Repo.totalHoras({registroHoras:(inst.registroHoras||[]).filter(r=>r.trabajadorId===id && !r.esExtra)});
    if(min>0) datosHoras.push({nombre: t?t.nombre:'—', minutos: min});

  const totalMin = (inst.registroHoras||[]).reduce((acc,r)=>{

/* ===================== SIGNATURE PAD ===================== */
App.SignaturePad = (function(){
  const pads = {};

  function montar(canvasId, dataUrlPrevia){
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    const ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.strokeStyle = '#1F2421';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    let dibujando = false, last = null;

    pads[canvasId] = {canvas, ctx, vacio:true};

    if(dataUrlPrevia){
      const img = new Image();
      img.onload = ()=> ctx.drawImage(img,0,0,rect.width,rect.height);
      img.src = dataUrlPrevia;
      pads[canvasId].vacio = false;
    }

    function pos(e){
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {x: t.clientX - r.left, y: t.clientY - r.top};
    }
    function start(e){ e.preventDefault(); dibujando=true; last=pos(e); }
    function move(e){
      if(!dibujando) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last = p; pads[canvasId].vacio=false;
    }
    function end(){ dibujando=false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
  }

  function limpiar(canvasId){
    const p = pads[canvasId];
    if(!p) return;
    p.ctx.clearRect(0,0,p.canvas.width,p.canvas.height);
    p.vacio = true;
  }

  function obtenerDataUrl(canvasId){
    const p = pads[canvasId];
    if(!p || p.vacio) return null;
    return p.canvas.toDataURL('image/png');
  }

  return {montar, limpiar, obtenerDataUrl};
})();

  function _opcionesAsignado(i, trabCat, grupos, incluirSinAsignar){

    (i.personalFijoIds||[]).forEach(id=>{

    grupos.forEach(g=>{

    });
    return opciones;

  // ---- PDF reporte interno ----
  async function _encabezadoEmpresa(doc){
    const nombreCfg = await App.Repo.config('empresaNombre');
    const logoCfg = await App.Repo.config('empresaLogo');
    let xTexto = 14;
    let hayEncabezado = false;
    if(logoCfg && logoCfg.value){
      const m = logoCfg.value.match(/^data:image\/(png|jpe?g)/i);
      const fmt = (m && m[1].toLowerCase().startsWith('jpg')) || (m && m[1].toLowerCase().startsWith('jpeg')) ? 'JPEG' : 'PNG';
      try{ doc.addImage(logoCfg.value, fmt, 14, 8, 20, 20); xTexto = 38; hayEncabezado = true; }catch(e){}
    }
    if(nombreCfg && nombreCfg.value){
      doc.setFontSize(11); doc.text(nombreCfg.value, xTexto, 18);
      hayEncabezado = true;
    }
    return hayEncabezado ? 34 : 18;
  }

  async function generarReportePDF(instId){
    const i = await inst(instId);
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF();
    let y = await _encabezadoEmpresa(doc);
    doc.setFontSize(16); doc.text('Reporte de Instalación', 14, y); y+=8;
    doc.setFontSize(11);
    doc.text('Proyecto: '+i.nombre, 14, y); y+=6;
    doc.text('Cliente: '+(i.cliente||'—'), 14, y); y+=6;
    doc.text('Ubicación: '+(i.ubicacion||'—'), 14, y); y+=6;
    doc.text('Estado: '+i.estado, 14, y); y+=10;

    doc.setFontSize(13); doc.text('Cronograma', 14, y); y+=7; doc.setFontSize(10);
    (i.cronograma||[]).forEach(a=>{
      doc.text('- '+a.nombre+' | est: '+a.horasEstimadas+'h'+(a.horasReales? ' | real: '+a.horasReales+'h':''), 14, y); y+=6;
      if(y>270){doc.addPage(); y=18;}
    });
    y+=4;
    doc.setFontSize(13); doc.text('Problemas', 14, y); y+=7; doc.setFontSize(10);
    (i.problemas||[]).forEach(p=>{
      doc.text('- ['+p.estado+'] '+p.texto.slice(0,80), 14, y); y+=6;
      if(y>270){doc.addPage(); y=18;}
    });
    y+=4;
    doc.setFontSize(13); doc.text('Bitácora diaria', 14, y); y+=7; doc.setFontSize(10);
    (i.bitacoraDiaria||[]).forEach(b=>{
      doc.text('- '+fmtFecha(b.fecha)+': '+b.texto.slice(0,80), 14, y); y+=6;
      if(y>270){doc.addPage(); y=18;}
    });

    doc.save('Reporte_'+i.nombre.replace(/\s+/g,'_')+'.pdf');
  }

  async function generarReporteHorasPersona(key){
    const acumulado = await App.Repo.horasDetalladas();
    const p = acumulado[key];
    if(!p){ toast('Sin datos de horas para esta persona'); return; }
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF();
    let y = await _encabezadoEmpresa(doc);
    doc.setFontSize(16); doc.text('Reporte de Horas', 14, y); y+=8;
    doc.setFontSize(12); doc.text(p.nombre, 14, y); y+=6;
    const totalH = Math.floor(p.minutos/60), totalM = p.minutos%60;
    doc.setFontSize(10); doc.text('Total acumulado: '+totalH+'h '+totalM+'m', 14, y); y+=10;
    doc.setFontSize(11); doc.text('Fecha', 14, y); doc.text('Proyecto', 50, y); doc.text('Entrada', 110, y); doc.text('Salida', 140, y); doc.text('Horas', 170, y); y+=6;
    doc.setLineWidth(0.2); doc.line(14,y-2,196,y-2);
    doc.setFontSize(10);
    p.entradas.forEach(e=>{
      const h = Math.floor(e.minutos/60), m = e.minutos%60;
      doc.text(fmtFecha(e.fecha), 14, y);
      doc.text((e.proyecto||'').slice(0,25), 50, y);
      doc.text(e.entrada, 110, y);
      doc.text(e.salida, 140, y);
      doc.text(h+'h '+m+'m', 170, y);
      y+=6;
      if(y>270){doc.addPage(); y=18;}
    });
    doc.save('Horas_'+p.nombre.replace(/\s+/g,'_')+'.pdf');
  }

  async function generarReporteHorasTodos(){
    const acumulado = await App.Repo.horasDetalladas();
    const entradas = Object.values(acumulado).sort((a,b)=>b.minutos-a.minutos);
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF();
    let y = await _encabezadoEmpresa(doc);
    doc.setFontSize(16); doc.text('Reporte de Horas — Todos los maestros', 14, y); y+=10;
    entradas.forEach(p=>{
      if(y>250){doc.addPage(); y=18;}
      const totalH = Math.floor(p.minutos/60), totalM = p.minutos%60;
      doc.setFontSize(12); doc.text(p.nombre+'  —  '+totalH+'h '+totalM+'m', 14, y); y+=7;
      doc.setFontSize(9);
      p.entradas.forEach(e=>{
        const h = Math.floor(e.minutos/60), m = e.minutos%60;
        doc.text('  '+fmtFecha(e.fecha)+'  ·  '+(e.proyecto||'').slice(0,22)+'  ·  '+e.entrada+'-'+e.salida+'  ·  '+h+'h '+m+'m', 14, y);
        y+=5.5;
        if(y>270){doc.addPage(); y=18;}
      });
      y+=5;
    });
    doc.save('Horas_Todos_los_maestros.pdf');
  }

  function limpiarFirma(canvasId){ App.SignaturePad.limpiar(canvasId); }

  async function generarActaPDF(instId){
    const i = await inst(instId);
    const fecha = document.getElementById('actaFecha').value;
    const obs = document.getElementById('actaObs').value.trim();
    const firmaCliente = App.SignaturePad.obtenerDataUrl('sigCliente');
    const firmaResponsable = App.SignaturePad.obtenerDataUrl('sigResponsable');

    if(!firmaCliente || !firmaResponsable){
      toast('Faltan firmas por capturar'); return;
    }

    i.acta = {observaciones:obs, firmaCliente, firmaResponsable, fechaEntrega:fecha};
    await App.Repo.guardar(i);

    const {jsPDF} = window.jspdf;
    const doc = new jsPDF();
    let y = await _encabezadoEmpresa(doc);
    doc.setFontSize(17); doc.text('Acta de Entrega', 14, y); y+=10;
    doc.setFontSize(11);
    doc.text('Proyecto: '+i.nombre, 14, y); y+=6;
    doc.text('Cliente: '+(i.cliente||'—'), 14, y); y+=6;
    doc.text('Ubicación: '+(i.ubicacion||'—'), 14, y); y+=6;
    doc.text('Fecha de entrega: '+fmtFecha(fecha), 14, y); y+=10;

    doc.setFontSize(13); doc.text('Lo instalado', 14, y); y+=7; doc.setFontSize(10);
    (i.materiales||[]).forEach(m=>{ doc.text('- '+m.nombre, 14, y); y+=6; if(y>270){doc.addPage(); y=18;} });
    if(i.produccion && i.produccion.unidadTotal>0){
      const calc = App.Repo.calcularProduccion(i);
      doc.text('- '+calc.totalInstalado+' de '+calc.unidadTotal+' '+(i.produccion.unidadNombre||'unidades')+' ('+calc.pct+'%)', 14, y); y+=6;
      (i.produccion.zonas||[]).forEach(z=>{
        const cant = calc.porZona[z.id]||0;
        doc.text('   · '+z.nombre+': '+cant+'/'+z.cantidadRequerida, 14, y); y+=6;
        if(y>270){doc.addPage(); y=18;}
      });
    }
    (i.cronograma||[]).filter(a=>a.completada).forEach(a=>{ doc.text('- '+a.nombre+' (completada)', 14, y); y+=6; if(y>270){doc.addPage(); y=18;} });
    y+=6;

    doc.setFontSize(13); doc.text('Observaciones del cliente', 14, y); y+=7; doc.setFontSize(10);
    const obsLines = doc.splitTextToSize(obs || 'Sin observaciones.', 180);
    doc.text(obsLines, 14, y); y += obsLines.length*5.5 + 10;

    if(y>220){ doc.addPage(); y=20; }
    doc.setFontSize(11); doc.text('Firma del cliente', 14, y);
    doc.text('Firma del responsable', 110, y);
    y+=4;
    doc.addImage(firmaCliente, 'PNG', 14, y, 80, 35);
    doc.addImage(firmaResponsable, 'PNG', 110, y, 80, 35);

    doc.save('Acta_Entrega_'+i.nombre.replace(/\s+/g,'_')+'.pdf');
    toast('Acta generada');
  }

  return {
    eliminarSub, guardarCotizacion,
    agregarChecklistItem, _confirmarChecklistItem, cargarChecklistEstandar, toggleChecklistGeneral,
    subirDocumento,
    limpiarFirma, generarActaPDF,
    agregarHerramientaPropia, _confirmarHerramientaPropia, toggleHerramientaPropia,
    agregarHerramientaSolicitar, _confirmarHerramientaSolicitar, toggleEstadoSolicitar,
    agregarHerramientaComprar, _confirmarHerramientaComprar,
    agregarMaterial, _confirmarMaterial, toggleMaterial,
    agregarTransporte, _confirmarTransporte, marcarEntregado,
    agregarPersonalFijo, _confirmarPersonalFijo, _crearYAsignarTrabajador, quitarPersonalFijo, _confirmarGrupoFijo,
    agregarPersonalExtra, _confirmarPersonalExtra,
    checar,
    agregarActividad, _confirmarActividad, completarActividad, _confirmarCompletar, reasignarActividad, _confirmarReasignar,
    crearEquipoInline, _confirmarEquipoInline, configurarFechasProyecto, _confirmarFechasProyecto,
    configurarProduccion, _confirmarProduccion, agregarZona, _confirmarZona, registrarAvance, _confirmarAvance,
    agregarBitacora, _confirmarBitacora,
    agregarProblema, _confirmarProblema, toggleProblema,
    pasarACurso, marcarFinalizada,
    generarReportePDF, generarReporteHorasPersona, generarReporteHorasTodos,
    checklistEstandarDefault
  };
})();

App.Views.dashboard = async function(){
  const {esc} = App.UIHelpers;
  const instalaciones = await App.Repo.listar();
  instalaciones.sort((a,b)=> (b.creado||'').localeCompare(a.creado||''));

  const curso = instalaciones.filter(i=>i.estado==='curso');
  const pendientes = instalaciones.filter(i=>i.estado==='pendiente');
  const finalizadas = instalaciones.filter(i=>i.estado==='final');
  const conProblemas = instalaciones.filter(i=> (i.problemas||[]).some(p=>p.estado==='abierto')).length;

  function tarjeta(inst){
    const avance = App.Repo.calcularAvance(inst);
    const abiertos = (inst.problemas||[]).filter(p=>p.estado==='abierto').length;
    const personalTotal = (inst.personalFijoIds||[]).length + (inst.personalExtra||[]).length;
    const riesgo = App.Charts.calcularRiesgo(inst);
    const mostrarRiesgo = inst.estado==='curso' && riesgo.enRiesgo;
    const stampClass = mostrarRiesgo ? 'riesgo' : (inst.estado==='curso'?'curso':(inst.estado==='final'?'final':'pendiente'));
    const stampTxt = mostrarRiesgo ? 'En riesgo' : (inst.estado==='curso'?'En curso':(inst.estado==='final'?'Finalizada':'Pendiente'));
    const buscador = (inst.nombre+' '+(inst.cliente||'')+' '+(inst.ubicacion||'')).toLowerCase();
    return '<div class="proyecto-wrap" data-search="'+esc(buscador)+'" data-problema="'+(abiertos?'1':'0')+'">'+
    '<div class="card" onclick="App.Router.abrirInstalacion(\''+inst.id+'\')">'+
      '<div class="proyecto-top">'+
        '<div><div class="proyecto-nombre">'+esc(inst.nombre)+'</div>'+
        '<div class="proyecto-cliente">'+esc(inst.cliente||'Sin cliente')+'</div></div>'+
        '<span class="stamp '+stampClass+'">'+stampTxt+'</span>'+
      '</div>'+
      '<div class="proyecto-meta">'+
        '<div class="meta-item">📍 <b>'+esc(inst.ubicacion||'—')+'</b></div>'+
        '<div class="meta-item">👷 <b>'+personalTotal+'</b> personal</div>'+
        (abiertos? '<div class="meta-item">⚠️ <b>'+abiertos+'</b> problema(s)</div>' : '')+
        (inst.fechaFinPlan? '<div class="meta-item">🏁 <b>'+fmtFecha(inst.fechaFinPlan)+'</b></div>' : '')+
      '</div>'+
      (inst.estado!=='pendiente' ? '<div class="progress-track"><div class="progress-fill '+(inst.estado==='final'?'done':'')+'" style="width:'+avance+'%"></div></div>' : '')+
    '</div></div>';
  }

  const html =
    '<div class="topbar">'+
      '<div class="eyebrow">Sistema de Instalaciones</div>'+
      '<h1>Panel General</h1>'+
      '<div class="sub">Isaac Zamora · Jefe de Instalaciones</div>'+
      '<button class="iconbtn" onclick="App.Router.abrirAjustes()">⚙️</button>'+
    '</div>'+
    '<div class="content">'+
      '<input type="text" id="buscarProyecto" placeholder="Buscar por nombre, cliente o ciudad..." oninput="App.Views.filtrarProyectos(this.value)" style="margin-bottom:12px;">'+
      '<div class="kpi-row">'+
        '<div class="kpi" onclick="App.Views.filtrarProblemas(false)" style="cursor:pointer;"><div class="num">'+curso.length+'</div><div class="lbl">Activas</div></div>'+
        '<div class="kpi alert" onclick="App.Views.filtrarProblemas(true)" style="cursor:pointer;"><div class="num">'+conProblemas+'</div><div class="lbl">Con problemas</div></div>'+
        '<div class="kpi" onclick="App.Views.filtrarProblemas(false)" style="cursor:pointer;"><div class="num">'+finalizadas.length+'</div><div class="lbl">Finalizadas</div></div>'+
      '</div>'+
      ((curso.length+pendientes.length)?
      '<div class="kpi-row" style="margin-top:8px;">'+
        '<div class="kpi kpi-action" onclick="App.Views.accesoRapido(\'checador\')"><div class="num" style="font-size:19px;">⏱️</div><div class="lbl">Marcar hora</div></div>'+
        '<div class="kpi kpi-action" onclick="App.Views.accesoRapido(\'problema\')"><div class="num" style="font-size:19px;">⚠️</div><div class="lbl">Problema</div></div>'+
        '<div class="kpi kpi-action" onclick="App.Views.accesoRapido(\'bitacora\')"><div class="num" style="font-size:19px;">📝</div><div class="lbl">Bitácora</div></div>'+
      '</div>' : '')+
      (curso.length? '<div class="section-label">En curso</div>'+curso.map(tarjeta).join('') : '')+
      (pendientes.length? '<div class="section-label">Pendientes por salir</div>'+pendientes.map(tarjeta).join('') : '')+
      (finalizadas.length? '<div class="section-label">Finalizadas</div>'+finalizadas.map(tarjeta).join('') : '')+
      (!instalaciones.length? '<div class="empty">No tienes instalaciones todavía.<br>Toca el botón + para crear la primera.</div>' : '')+
      '<div class="empty" id="sinResultados" style="display:none;">Sin resultados</div>'+
    '</div>'+
    '<button class="fab" onclick="App.Router.nuevaInstalacion()">+</button>'+
    '<div class="tabbar">'+
      '<button class="tabbar-item active">🏠<div>Panel</div></button>'+
      '<button class="tabbar-item" onclick="App.Router.abrirPersonalGlobal()">👷<div>Personal</div></button>'+
      '<button class="tabbar-item" onclick="App.Router.abrirAjustes()">⚙️<div>Ajustes</div></button>'+
    '</div>';
  document.getElementById('app').innerHTML = html;
};

App.Views.filtrarProyectos = function(texto){
  const t = texto.trim().toLowerCase();
  let visibles = 0;
  document.querySelectorAll('.proyecto-wrap').forEach(el=>{
    const match = el.getAttribute('data-search').includes(t);
    el.style.display = match ? '' : 'none';
    if(match) visibles++;
  });
  const sinRes = document.getElementById('sinResultados');
  if(sinRes) sinRes.style.display = (t && visibles===0) ? '' : 'none';
};
App.Views.filtrarProblemas = function(soloConProblemas){
  let visibles = 0;
  document.querySelectorAll('.proyecto-wrap').forEach(el=>{
    const match = !soloConProblemas || el.getAttribute('data-problema')==='1';
    el.style.display = match ? '' : 'none';
    if(match) visibles++;
  });
  const buscador = document.getElementById('buscarProyecto');
  if(buscador) buscador.value = '';
  const sinRes = document.getElementById('sinResultados');
  if(sinRes) sinRes.style.display = visibles===0 ? '' : 'none';
};

App.Views.accesoRapido = async function(tipo){
  const {esc, openModal, closeModal} = App.UIHelpers;
  const todas = await App.Repo.listar();
  const activas = todas.filter(i=>i.estado==='curso' || i.estado==='pendiente');
  if(!activas.length){ App.UIHelpers.toast('No tienes instalaciones activas'); return; }

  async function ejecutar(instId){
    closeModal();
    if(tipo==='checador'){
      await App.Router.abrirInstalacion(instId);
      await App.Router.cambiarFase('durante');
    } else if(tipo==='problema'){
      await App.Router.abrirInstalacion(instId);
      App.Handlers.agregarProblema(instId);
    } else if(tipo==='bitacora'){
      await App.Router.abrirInstalacion(instId);
      App.Handlers.agregarBitacora(instId);
    }
  }

  if(activas.length===1){
    ejecutar(activas[0].id);
    return;
  }
  const opciones = activas.map(i=>'<button class="btn-outline" onclick="App.Views._ejecutarAccesoRapido(\''+tipo+'\',\''+i.id+'\')">'+esc(i.nombre)+'</button>').join('');
  openModal('¿En qué instalación?', opciones);
  App.Views._ejecutarAccesoRapido = (t,id)=> ejecutar(id);
};

  let instActualId = null;
  let faseActual = 'antes';

  function irDashboard(){ instActualId=null; App.Views.dashboard(); }

  function nuevaInstalacion(){
    const {openModal, closeModal} = App.UIHelpers;
    openModal('Nueva instalación',
      '<label>Nombre del proyecto</label><input type="text" id="fNombre" placeholder="Ej. Residencial Altavista">'+
      '<label>Cliente</label><input type="text" id="fCliente" placeholder="Nombre del cliente">'+
      '<label>Ubicación</label><input type="text" id="fUbicacion" placeholder="Ciudad / dirección">'+
      '<label>Fecha de inicio</label><input type="date" id="fFecha" value="'+hoy()+'">'+
      '<label>Fecha planeada de entrega (opcional, para proyectos largos)</label><input type="date" id="fFechaFin">'+
      '<button class="btn-primary" onclick="App.Router._crearInstalacion()">Crear instalación</button>'
    );
  }
  async function _crearInstalacion(){
    const nombre = document.getElementById('fNombre').value.trim();
    if(!nombre){ App.UIHelpers.toast('Ponle un nombre al proyecto'); return; }
    const cliente = document.getElementById('fCliente').value.trim();
    const ubicacion = document.getElementById('fUbicacion').value.trim();

    const fechaFinPlan = document.getElementById('fFechaFin').value;
    const inst = await App.Repo.nuevaInstalacion({nombre, cliente, ubicacion, fechaInicio, fechaFinPlan});
    App.UIHelpers.closeModal();
    abrirInstalacion(inst.id);
  }

  async function abrirInstalacion(id){
    instActualId = id;
    const inst = await App.Repo.obtener(id);
    faseActual = inst.estado==='curso' ? 'durante' : (inst.estado==='final' ? 'despues' : 'antes');
    App.Views.detalle(inst, faseActual);
  }

  async function cambiarFase(fase){
    faseActual = fase;
    const inst = await App.Repo.obtener(instActualId);
    App.Views.detalle(inst, fase);
  }

  async function instActual(){ return App.Repo.obtener(instActualId); }

  async function refrescar(){
    const inst = await App.Repo.obtener(instActualId);
    App.Views.detalle(inst, faseActual);
  }

  function abrirAjustes(){
    App.Views.ajustes();
  }
  function abrirPersonalGlobal(){
    App.Views.personalGlobal();
  }
  function abrirTareas(tipo, id, nombre){
    App.Views.tareas(tipo, id, nombre);
  }
  function abrirHorasGlobales(){
    App.Views.horasGlobales();
  }

  async function abrirActa(id){
    instActualId = id;
    const i = await App.Repo.obtener(id);
    App.Views.acta(i);
  }

  return {
    irDashboard, nuevaInstalacion, _crearInstalacion, abrirInstalacion,
    cambiarFase, instActual, refrescar, abrirAjustes, abrirPersonalGlobal, abrirActa, abrirTareas, abrirHorasGlobales
  };
})();

/* ===================== VISTA: ACTA DE ENTREGA ===================== */
App.Views.acta = async function(inst){
  const {esc} = App.UIHelpers;
  let instaladoHtml = '';
  if((inst.materiales||[]).length){
    instaladoHtml += (inst.materiales||[]).map(m=>
      '<div class="check-row"><button class="checkbox on" style="pointer-events:none;"></button><div class="check-label">'+esc(m.nombre)+'</div></div>'
    ).join('');
  }
  if(inst.produccion && inst.produccion.unidadTotal>0){
    const calc = App.Repo.calcularProduccion(inst);
    instaladoHtml += '<div class="check-row"><div class="check-label">'+calc.totalInstalado+' de '+calc.unidadTotal+' '+esc(inst.produccion.unidadNombre||'unidades')+' ('+calc.pct+'%)</div></div>';
    (inst.produccion.zonas||[]).forEach(z=>{
      const cant = calc.porZona[z.id]||0;
      instaladoHtml += '<div class="check-row"><div class="check-label" style="padding-left:10px;">'+esc(z.nombre)+'</div><b style="font-size:12px;">'+cant+'/'+z.cantidadRequerida+'</b></div>';
    });
  }
  const completadasCrono = (inst.cronograma||[]).filter(a=>a.completada);
  if(completadasCrono.length){
    instaladoHtml += completadasCrono.map(a=>
      '<div class="check-row"><button class="checkbox on" style="pointer-events:none;"></button><div class="check-label">'+esc(a.nombre)+'</div></div>'
    ).join('');
  }
  if(!instaladoHtml) instaladoHtml = '<div class="empty" style="padding:14px 0;">Sin materiales, producción o actividades registradas en el proyecto</div>';

  const html =
    '<div class="topbar" style="padding-bottom:20px;">'+
      '<button class="back" onclick="App.Router.cambiarFase(\'despues\')">‹ INSTALACIÓN</button>'+
      '<div class="det-title">Acta de Entrega</div>'+
      '<div class="det-cliente">'+esc(inst.nombre)+' — '+esc(inst.cliente||'')+'</div>'+
    '</div>'+
    '<div class="content">'+
      '<div class="card"><h3>Datos generales</h3>'+
        '<div class="check-row"><div class="check-label">Cliente</div><b>'+esc(inst.cliente||'—')+'</b></div>'+
        '<div class="check-row"><div class="check-label">Ubicación</div><b>'+esc(inst.ubicacion||'—')+'</b></div>'+
        '<label style="margin-top:8px;">Fecha de entrega</label><input type="date" id="actaFecha" value="'+(inst.acta.fechaEntrega||hoy())+'">'+
      '</div>'+
      '<div class="card"><h3>Lo instalado</h3>'+instaladoHtml+'</div>'+
      '<div class="card"><h3>Observaciones / inconformidades del cliente</h3>'+
        '<textarea id="actaObs" placeholder="Escribe observaciones del cliente, si las hay...">'+esc(inst.acta.observaciones||'')+'</textarea>'+
      '</div>'+
      '<div class="card"><h3>Firma del cliente</h3>'+
        '<canvas class="sig-pad" id="sigCliente"></canvas>'+
        '<div class="sig-actions"><button class="btn-outline" onclick="App.Handlers.limpiarFirma(\'sigCliente\')">Borrar</button></div>'+
      '</div>'+
      '<div class="card"><h3>Firma del responsable</h3>'+
        '<canvas class="sig-pad" id="sigResponsable"></canvas>'+
        '<div class="sig-actions"><button class="btn-outline" onclick="App.Handlers.limpiarFirma(\'sigResponsable\')">Borrar</button></div>'+
      '</div>'+
      '<button class="btn-primary" onclick="App.Handlers.generarActaPDF(\''+inst.id+'\')">Generar Acta en PDF</button>'+
    '</div>';
  document.getElementById('app').innerHTML = html;

  App.SignaturePad.montar('sigCliente', inst.acta.firmaCliente);
  App.SignaturePad.montar('sigResponsable', inst.acta.firmaResponsable);
};
</script>
